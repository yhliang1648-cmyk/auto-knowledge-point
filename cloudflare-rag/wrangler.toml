name = "dse-rag-api"
main = "src/worker.js"
compatibility_date = "2024-12-01"

# Cloudflare Workers配置
# 用于DSE考题智能检索系统的RAG后端

[vars]
# 环境变量
QWEN_API_KEY = "sk-e79b72b1a216405c89206aefe865139e"
QWEN_API_ENDPOINT = "https://dashscope.aliyuncs.com"

# Vectorize绑定 - 用于向量搜索
[[vectorize]]
binding = "VECTORIZE"
index_name = "dse-questions-index"

# D1数据库绑定 - 用于存储题目元数据
[[d1_databases]]
binding = "DB"
database_name = "dse_questions_db"
database_id = "your-database-id"  # 需要创建D1数据库后替换

# R2存储绑定 - 用于存储PDF文件
[[r2_buckets]]
binding = "PDF_BUCKET"
bucket_name = "dse-pdfs"

# KV命名空间绑定 - 用于缓存
[[kv_namespaces]]
binding = "CACHE"
id = "your-kv-namespace-id"  # 需要创建KV命名空间后替换
