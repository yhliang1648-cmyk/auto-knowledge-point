<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSE 考題智能檢索系統 | RAG 知識庫</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1rem;
        }

        .search-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #searchInput {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        #searchInput:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-weight: 500;
        }

        select {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .results-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: none;
        }

        .results-section.show {
            display: block;
        }

        .ai-answer {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .ai-answer h3 {
            color: #667eea;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ai-answer-content {
            line-height: 1.8;
            color: #333;
        }

        .questions-list h3 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .question-item {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .question-item:hover {
            background: #f0f0f0;
            transform: translateX(5px);
        }

        .question-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .meta-tag {
            display: inline-block;
            padding: 5px 12px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .meta-tag.year {
            background: #764ba2;
        }

        .meta-tag.subject {
            background: #f093fb;
        }

        .question-content {
            color: #333;
            line-height: 1.6;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .stat-item {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        footer {
            text-align: center;
            color: white;
            padding: 20px;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .search-box {
                flex-direction: column;
            }

            .filters {
                flex-direction: column;
            }

            .stats {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎓 DSE 考題智能檢索系統</h1>
            <p class="subtitle">基於 AI 的香港中學文憑試歷屆考題知識庫 (2012-2025)</p>
        </div>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="輸入問題或關鍵詞，例如：「通識科氣候變化」、「數學概率題」..."
                    onkeypress="handleKeyPress(event)"
                />
                <button class="search-btn" onclick="search()" id="searchBtn">
                    🔍 智能搜索
                </button>
            </div>

            <div class="filters">
                <div class="filter-group">
                    <label for="subjectFilter">📚 科目篩選</label>
                    <select id="subjectFilter">
                        <option value="all">所有科目</option>
                        <option value="chinese">中國語文</option>
                        <option value="english">英國語文</option>
                        <option value="math">數學</option>
                        <option value="liberal">通識教育</option>
                        <option value="biology">生物</option>
                        <option value="chemistry">化學</option>
                        <option value="physics">物理</option>
                        <option value="history">歷史</option>
                        <option value="geography">地理</option>
                        <option value="economics">經濟</option>
                        <option value="bafs">企業、會計與財務概論</option>
                        <option value="ict">資訊及通訊科技</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="yearFilter">📅 年份篩選</label>
                    <select id="yearFilter">
                        <option value="all">所有年份</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                        <option value="2020">2020</option>
                        <option value="2019">2019</option>
                        <option value="2018">2018</option>
                        <option value="2017">2017</option>
                        <option value="2016">2016</option>
                        <option value="2015">2015</option>
                        <option value="2014">2014</option>
                        <option value="2013">2013</option>
                        <option value="2012">2012</option>
                    </select>
                </div>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalQuestions">---</div>
                    <div class="stat-label">題目總數</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">12</div>
                    <div class="stat-label">科目數量</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">14</div>
                    <div class="stat-label">年份跨度 (2012-2025)</div>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div class="results-section" id="resultsSection">
            <!-- AI Answer -->
            <div class="ai-answer" id="aiAnswer" style="display: none;">
                <h3>🤖 AI 智能解答</h3>
                <div class="ai-answer-content" id="aiAnswerContent"></div>
            </div>

            <!-- Loading -->
            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>正在智能檢索相關考題...</p>
            </div>

            <!-- Questions List -->
            <div class="questions-list" id="questionsList">
                <h3>📝 相關考題</h3>
                <div id="questionsContent"></div>
            </div>

            <!-- No Results -->
            <div class="no-results" id="noResults" style="display: none;">
                <p>😔 未找到相關考題，請嘗試其他關鍵詞或調整篩選條件</p>
            </div>
        </div>

        <footer>
            <p>© 2025 DSE RAG System | Powered by Cloudflare Workers AI & Vectorize</p>
            <p style="margin-top: 10px; opacity: 0.8;">
                <a href="https://github.com/yhliang1648-cmyk/auto-knowledge-point"
                   style="color: white; text-decoration: none;">
                    ⭐ GitHub
                </a>
            </p>
        </footer>
    </div>

    <script>
        // Google Gemini API 配置
        const GEMINI_API_KEY = 'AIzaSyCwagWVu6Lu6IhshnRF83x8-6XD3duwJ_8';
        const GEMINI_EMBEDDING_MODEL = 'models/text-embedding-004';
        const GEMINI_CHAT_MODEL = 'models/gemini-1.5-flash';

        // 考題數據（將從 JSON 文件加載）
        let questionsData = [];

        // 處理回車鍵搜索
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                search();
            }
        }

        /**
         * 使用 Gemini API 生成文本嵌入
         */
        async function generateEmbedding(text) {
            const url = `https://generativelanguage.googleapis.com/v1beta/${GEMINI_EMBEDDING_MODEL}:embedContent?key=${GEMINI_API_KEY}`;

            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: GEMINI_EMBEDDING_MODEL,
                    content: {
                        parts: [{ text: text }]
                    }
                })
            });

            if (!response.ok) {
                throw new Error(`Gemini API 錯誤: ${response.status}`);
            }

            const data = await response.json();
            return data.embedding.values;
        }

        /**
         * 計算余弦相似度
         */
        function cosineSimilarity(vec1, vec2) {
            let dotProduct = 0;
            let norm1 = 0;
            let norm2 = 0;

            for (let i = 0; i < vec1.length; i++) {
                dotProduct += vec1[i] * vec2[i];
                norm1 += vec1[i] * vec1[i];
                norm2 += vec2[i] * vec2[i];
            }

            return dotProduct / (Math.sqrt(norm1) * Math.sqrt(norm2));
        }

        /**
         * 使用 Gemini 生成 AI 回答
         */
        async function generateAIAnswer(query, relatedQuestions) {
            const url = `https://generativelanguage.googleapis.com/v1beta/${GEMINI_CHAT_MODEL}:generateContent?key=${GEMINI_API_KEY}`;

            const context = relatedQuestions.slice(0, 3).map((q, i) =>
                `[${i + 1}] ${q.year} ${q.subject} ${q.paper} Q${q.number}: ${q.content}`
            ).join('\n\n');

            const prompt = `你是一位資深的香港 DSE 考試輔導專家。根據以下檢索到的歷屆 DSE 考題，為學生的問題提供專業的解答和建議。

學生問題：${query}

相關歷屆考題：
${context}

請提供：
1. 對學生問題的專業解答
2. 這些考題之間的關聯性
3. 學習建議和要點

請用繁體中文回答，語氣要專業且易於理解。回答要簡潔，控制在 200 字以內。`;

            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: prompt }]
                    }]
                })
            });

            if (!response.ok) {
                throw new Error(`Gemini API 錯誤: ${response.status}`);
            }

            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        }

        // 主搜索函數
        async function search() {
            const query = document.getElementById('searchInput').value.trim();
            const subjectFilter = document.getElementById('subjectFilter').value;
            const yearFilter = document.getElementById('yearFilter').value;

            if (!query) {
                alert('請輸入搜索關鍵詞');
                return;
            }

            // 顯示加載狀態
            showLoading();

            try {
                // 1. 生成查詢的嵌入向量
                console.log('生成查詢嵌入向量...');
                const queryEmbedding = await generateEmbedding(query);

                // 2. 為每道題目生成嵌入並計算相似度
                console.log('計算與考題的相似度...');
                const scoredQuestions = [];

                for (const question of questionsData) {
                    // 應用篩選
                    if (subjectFilter !== 'all' && question.subjectCode !== subjectFilter) continue;
                    if (yearFilter !== 'all' && question.year !== yearFilter) continue;

                    // 生成題目嵌入
                    const questionText = `${question.subject} ${question.content} ${question.keywords.join(' ')}`;
                    const questionEmbedding = await generateEmbedding(questionText);

                    // 計算相似度
                    const similarity = cosineSimilarity(queryEmbedding, questionEmbedding);

                    scoredQuestions.push({
                        ...question,
                        similarity: similarity
                    });

                    // 避免 API 限流，每題後延遲 100ms
                    await new Promise(resolve => setTimeout(resolve, 100));
                }

                // 3. 按相似度排序
                scoredQuestions.sort((a, b) => b.similarity - a.similarity);
                const topQuestions = scoredQuestions.slice(0, 5);

                // 4. 生成 AI 回答
                console.log('生成 AI 回答...');
                const aiAnswer = await generateAIAnswer(query, topQuestions);

                // 5. 顯示結果
                displayResults({
                    aiAnswer: aiAnswer,
                    questions: topQuestions
                });

            } catch (error) {
                console.error('搜索錯誤:', error);
                showError('搜索失敗：' + error.message);
            }
        }

        // 顯示加載狀態
        function showLoading() {
            document.getElementById('resultsSection').classList.add('show');
            document.getElementById('loading').style.display = 'block';
            document.getElementById('aiAnswer').style.display = 'none';
            document.getElementById('questionsList').style.display = 'none';
            document.getElementById('noResults').style.display = 'none';
            document.getElementById('searchBtn').disabled = true;
        }

        // 顯示結果
        function displayResults(results) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('searchBtn').disabled = false;

            if (!results || results.questions.length === 0) {
                document.getElementById('noResults').style.display = 'block';
                return;
            }

            // 顯示 AI 回答
            if (results.aiAnswer) {
                document.getElementById('aiAnswer').style.display = 'block';
                document.getElementById('aiAnswerContent').innerHTML = results.aiAnswer;
            }

            // 顯示題目列表
            document.getElementById('questionsList').style.display = 'block';
            const questionsHTML = results.questions.map(q => `
                <div class="question-item">
                    <div class="question-meta">
                        <span class="meta-tag year">${q.year}</span>
                        <span class="meta-tag subject">${q.subject}</span>
                        <span class="meta-tag">${q.paper}</span>
                    </div>
                    <div class="question-content">
                        <strong>Q${q.number}:</strong> ${q.content}
                    </div>
                </div>
            `).join('');
            document.getElementById('questionsContent').innerHTML = questionsHTML;
        }

        // 顯示錯誤
        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('searchBtn').disabled = false;
            alert(message);
        }

        /**
         * 加載考題數據
         */
        async function loadQuestionsData() {
            try {
                const response = await fetch('data/questions/all-questions.json');
                if (!response.ok) {
                    throw new Error('無法加載考題數據');
                }
                questionsData = await response.json();
                console.log(`✅ 已加載 ${questionsData.length} 道考題`);

                // 更新統計數據
                document.getElementById('totalQuestions').textContent = questionsData.length;

                return questionsData;
            } catch (error) {
                console.error('加載考題數據失敗:', error);
                alert('無法加載考題數據，請刷新頁面重試');
                return [];
            }
        }

        // 頁面加載時初始化
        window.addEventListener('load', async () => {
            console.log('🚀 DSE RAG 系統啟動中...');
            console.log('🔑 Gemini API 已配置');

            // 加載考題數據
            await loadQuestionsData();

            console.log('✅ 系統就緒！');
            console.log('💡 提示：搜索會使用 Google Gemini API 進行智能語義匹配');
        });
    </script>
</body>
</html>
