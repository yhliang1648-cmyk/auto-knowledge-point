<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Knowledge Point - 自动知识点生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            color: #667eea;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 40px;
        }

        .description {
            text-align: left;
            margin-bottom: 40px;
            padding: 20px;
            background: #f7f7f7;
            border-radius: 10px;
        }

        .description h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .description ul {
            list-style: none;
            padding-left: 0;
        }

        .description li {
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .description li:last-child {
            border-bottom: none;
        }

        .description li:before {
            content: "✓ ";
            color: #667eea;
            font-weight: bold;
            margin-right: 10px;
        }

        .github-link {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .github-link:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .status {
            margin-top: 30px;
            padding: 15px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 5px;
            text-align: left;
        }

        .status strong {
            color: #856404;
        }

        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            color: #999;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Auto Knowledge Point</h1>
        <p class="subtitle">自动化知识点生成与管理系统</p>

        <div class="description">
            <h2>项目简介</h2>
            <ul>
                <li>自动提取和整理知识点</li>
                <li>智能分类和标签管理</li>
                <li>支持多种格式导出</li>
                <li>基于 AI 的内容分析</li>
                <li>可视化知识图谱</li>
            </ul>
        </div>

        <div class="status">
            <strong>📌 开发状态：</strong> 项目正在积极开发中，敬请期待更多功能！
        </div>

        <div style="margin-top: 30px;">
            <a href="https://github.com/yhliang1648-cmyk/auto-knowledge-point" class="github-link" target="_blank">
                查看 GitHub 仓库
            </a>
        </div>

        <footer>
            <p>MIT License © 2025 yhliang1648-cmyk</p>
            <p style="margin-top: 10px;">Powered by Claude AI & Cloudflare Pages</p>
        </footer>
    </div>
</body>
</html>
